name: pull_request

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - .devcontainer/**
      - .vscode/**
      - docs/**
      - README.md
      - LICENSE
      - .gitignore
      - .github/workflows/**

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Create Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and cache
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: rna_splice_tool
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: |
          docker run --entrypoint Rscript --rm rna_splice_tool -e "devtools::test()"

      - name: Check samtools installation
        run: |
          docker run --entrypoint samtools --rm rna_splice_tool --version

      - name: Check docker cli via docker (default mode)
        run: |
          docker run --rm -v $(pwd)/tests:/tests -w /tests/testthat rna_splice_tool -f /tests/testthat/data/input/samples_default.tsv -o /tmp -r TRUE

      - name: Check docker cli via docker (research mode)
        run: |
          docker run --rm -v $(pwd)/tests:/tests -w /tests/testthat rna_splice_tool -f /tests/testthat/data/input/samples_research.tsv -m research -g EMD,DMD -o /tmp

      - name: Check subsetBamfiles
        run: |
          docker run --rm -v $(pwd):/working -w /working --entrypoint /working/tests/subsetBamfiles/test.sh rna_splice_tool
